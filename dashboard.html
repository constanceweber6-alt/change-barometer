<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Barometer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23141B2D%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27%23D9472B%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/report.css">
<style>
  .d-head { padding: 40px 0 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .d-head h1 { font-size: clamp(28px, 4vw, 42px); margin: 4px 0 0; line-height: 1.1; }
  .input-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }
  .or { display: grid; gap: 10px; align-content: start; }
  .file-btn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .report { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .summary { margin: 28px 0 14px; font-size: 19px; color: var(--ink-2); max-width: 70ch; }
  .summary strong { color: var(--ink); }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .heat-wrap { position: relative; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
  table.heat { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; font-size: 15px; }
  .heat th, .heat td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--line); }
  .heat thead th { font-size: 13px; font-weight: 600; color: var(--muted); vertical-align: bottom; line-height: 1.2; }
  .heat th[scope="row"] { text-align: left; font-weight: 600; white-space: nowrap; padding-left: 18px; }
  .heat th[scope="row"] .n { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .heat tr:last-child > * { border-bottom: 0; }
  .heat tr.all > * { background: #FAFBFC; }
  .cell { display: inline-grid; place-items: center; width: 54px; height: 38px; border-radius: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cell.ok { background: var(--ok); color: #fff; }
  .cell.watch { background: var(--watch-soft); color: #7A4F08; box-shadow: inset 0 0 0 2px var(--watch); }
  .cell.barrier { background: var(--barrier); color: #fff; }
  .cell.first { outline: 3px solid var(--ink); outline-offset: 2px; }
  .cell.none { background: var(--none); color: var(--muted); font-weight: 400; }
  .teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 28px; }
  .team { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; break-inside: avoid; }
  .team-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .team-head h3 { margin: 0; font-size: 22px; }
  .team-head .note { display: block; }
  .idx { text-align: right; }
  .idx b { font-family: var(--display); font-size: 30px; line-height: 1; display: block; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 20px 0 14px; font-size: 15px; }
  .facts span { color: var(--muted); }
  .facts strong { font-weight: 600; }
  .verdict { font-size: 16px; margin: 0 0 12px; }
  .todo { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; color: var(--ink-2); }
  .waiting { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .waiting li { background: var(--surface); border: 1px dashed var(--rail); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-state .line { max-width: 420px; margin: 0 auto 18px; opacity: .55; }
  .method { margin-top: 28px; }
  .collapsed-bar { display: none; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  #inputPanel.collapsed { padding: 16px 22px; }
  #inputPanel.collapsed .input-grid, #inputPanel.collapsed .report { display: none; }
  #inputPanel.collapsed .collapsed-bar { display: flex; }
  .heat th[scope="row"] a { color: inherit; text-decoration: none; }
  .heat th[scope="row"] a:hover { text-decoration: underline; }
  .team { scroll-margin-top: 80px; }
  .team.flash { box-shadow: 0 0 0 3px var(--ink); transition: box-shadow .3s; }
  .detail { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .detail summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  .qrows { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 8px; }
  .qrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 30px; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); }
  .qstage { margin: 14px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); }
  .qrows + .qstage { margin-top: 12px; }
  .qrow .st { font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--muted); }
  .qrow .bar { height: 8px; background: var(--none); border-radius: 4px; overflow: hidden; }
  .qrow .bar i { display: block; height: 100%; border-radius: 4px; }
  .qrow b { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
  .qrow.low { color: var(--ink); font-weight: 600; }
  .saved-list { list-style: none; padding: 0; margin: 16px auto 0; max-width: 520px; display: grid; gap: 8px; text-align: left; }
  .saved-list a { display: flex; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 16px; text-decoration: none; color: var(--ink); font-weight: 600; }
  .saved-list a:hover { border-color: var(--ink); }
  .saved-list span { color: var(--muted); font-weight: 400; font-size: 14px; }
  .method summary { cursor: pointer; font-weight: 600; }
  .method p, .method li { color: var(--ink-2); font-size: 15px; }

  /* Response tracking */
  .collect { position: relative; margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 24px; }
  .collect-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .collect h2, .plan-section h2 { font-size: 20px; margin: 0 0 4px; }
  .collect-rows { display: grid; gap: 8px; }
  .crow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 150px 110px; gap: 14px; align-items: center; font-size: 15px; }
  .cname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbar { height: 10px; background: var(--none); border-radius: 5px; overflow: hidden; }
  .cbar i { display: block; height: 100%; background: var(--rail); border-radius: 5px; transition: width .2s; }
  .cbar i.ok { background: var(--ok); } .cbar i.watch { background: var(--watch); } .cbar i.barrier { background: var(--barrier); }
  .crate { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .input-sm { padding: 7px 10px; font-size: 14px; }
  /* Action picks and plan */
  .picks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  .pick { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; font-size: 15px; color: var(--ink-2); }
  .pick:hover { background: var(--paper); }
  .pick input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ink); }
  .pick input:checked + span { color: var(--ink); font-weight: 600; }
  .custom-add { display: flex; gap: 8px; margin-top: 10px; }
  .custom-add input { flex: 1; min-width: 0; }
  .plan-section { margin-top: 36px; }
  .plan-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  table.plan-table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 680px; }
  .plan-table th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .plan-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .plan-table tr:last-child td { border-bottom: 0; }
  .plan-table td .n { display: block; font-size: 13px; color: var(--muted); }
  .plan-table td:nth-child(3) { width: 180px; } .plan-table td:nth-child(4) { width: 160px; }
  /* Share dialog */
  .dlg { border: 0; border-radius: var(--r-lg); padding: 24px; width: min(640px, calc(100vw - 32px)); color: var(--ink); }
  .dlg::backdrop { background: rgba(20, 27, 45, .5); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .dlg-head h2 { margin: 0; font-size: 22px; }
  .share-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: start; }
  .qr-box svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: var(--r-md); }
  .linkrow { display: flex; gap: 8px; } .linkrow input { flex: 1; min-width: 0; }
  /* Presentation */
  .deck { position: fixed; inset: 0; z-index: 100; background: var(--paper); display: grid; grid-template-rows: 1fr auto; }
  body.deck-open { overflow: hidden; }
  .deck-stage { overflow: auto; padding: 5vh 7vw 2vh; }
  .deck-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; color: var(--muted); }
  .slide { max-width: 1200px; margin: 0 auto; }
  .slide h2 { font-size: clamp(32px, 4.2vw, 60px); margin: 0 0 3vh; line-height: 1.05; }
  .slide h3 { font-size: clamp(18px, 1.6vw, 24px); margin: 4vh 0 1.5vh; }
  .slide ul { font-size: clamp(18px, 1.7vw, 26px); line-height: 1.45; padding-left: 1.2em; margin: 0; display: grid; gap: .5em; }
  .slide-kicker { color: var(--muted); font-size: clamp(14px, 1.2vw, 18px); margin: 0 0 6px; }
  .slide-summary { font-size: clamp(18px, 1.8vw, 28px); color: var(--ink-2); max-width: 46ch; margin: 0 0 4vh; }
  .slide-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .slide-idx { text-align: right; } .slide-idx b { display: block; font-family: var(--display); font-size: clamp(48px, 6vw, 96px); line-height: 1; }
  .slide-idx span { color: var(--muted); }
  .slide-verdict { font-size: clamp(20px, 2vw, 30px); margin: 4vh 0 0; max-width: 50ch; }
  .slide .line { transform-origin: left top; }
  .slide > .line .dot { width: 54px; height: 54px; font-size: 20px; border-width: 6px; }
  .slide > .line .station.stop .dot { width: 66px; height: 66px; }
  .slide > .line::before { top: 27px; height: 6px; }
  .slide > .line .name { font-size: clamp(14px, 1.3vw, 20px); } .slide > .line .score { font-size: clamp(14px, 1.2vw, 18px); }
  .slide > .line .stop-label { font-size: 14px; }
  .slide-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3vh 4vw; }
  .mini-name { font-weight: 700; font-size: clamp(16px, 1.4vw, 22px); display: block; margin-bottom: 8px; }
  .slide-plan { width: 100%; border-collapse: collapse; font-size: clamp(15px, 1.3vw, 20px); }
  .slide-plan th, .slide-plan td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .slide-plan th { color: var(--muted); font-size: .8em; }
  @media (max-width: 860px) {
    .crow { grid-template-columns: minmax(0, 1fr) 100px; }
    .crow .cbar { grid-column: 1 / -1; grid-row: 2; }
    .crow .crate { grid-column: 1; grid-row: 3; font-size: 14px; }
    .crow .csize { grid-column: 2; grid-row: 1 / span 1; }
    .crow { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .share-grid { grid-template-columns: minmax(0, 1fr); } .qr-box { max-width: 220px; }
    .slide-teams { grid-template-columns: minmax(0, 1fr); }
  }
  @media print {
    .collect { border: 0; padding: 0; }
    .crow { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) 160px; }
    .plan-table input { display: none; }
    table.plan-table { min-width: 0; }
    .deck, .dlg { display: none !important; }
  }
  @media (max-width: 860px) {
    .input-grid, .teams { grid-template-columns: minmax(0, 1fr); }
  }
  @media print {
    .teams { grid-template-columns: 1fr 1fr; gap: 10px; }
    .team { border: 1px solid var(--line); padding: 12px; }
    .heat-wrap { border: 0; overflow: visible; }
    table.heat { min-width: 0; }
    .cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .station .dot, .pill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .method { display: none; }
  }
</style>
</head>
<body data-page="dash" class="has-report">
<header id="nav" class="nav"></header>

<main class="wrap">
  <div class="d-head">
    <div><p class="sub" id="kicker"></p><h1 id="title"></h1></div>
    <div class="actions-row no-print" id="exports" hidden>
      <button class="btn btn-secondary btn-sm" type="button" id="shareBtn"></button>
      <button class="btn btn-secondary btn-sm" type="button" id="csvOut"></button>
      <button class="btn btn-secondary btn-sm" type="button" id="printOut"></button>
      <button class="btn btn-primary btn-sm" type="button" id="presentBtn"></button>
    </div>
  </div>
  <p class="print-only note" id="printDate"></p>

  <section class="panel no-print" id="inputPanel">
    <div class="collapsed-bar"><span id="loaded"></span><button class="btn btn-secondary btn-sm" type="button" id="expand"></button></div>
    <div class="input-grid">
      <div>
        <label class="label" for="codes" id="codesLabel"></label>
        <p class="note" id="codesHint" style="margin:4px 0 10px"></p>
        <textarea class="textarea" id="codes" spellcheck="false" autocomplete="off"></textarea>
        <div class="actions-row" style="margin-top:12px">
          <button class="btn btn-quiet" type="button" id="clear"></button>
        </div>
      </div>
      <div class="or">
        <span class="label" id="csvLabel"></span>
        <p class="note" id="csvHint" style="margin:0"></p>
        <div class="actions-row">
          <label class="btn btn-secondary file-btn"><input type="file" id="csvFile" accept=".csv,text/csv"><span id="csvBtn"></span></label>
          <button class="btn btn-quiet" type="button" id="tpl"></button>
        </div>
        <span class="label" style="margin-top:14px" id="demoLabel"></span>
        <div><button class="btn btn-secondary" type="button" id="demo"></button></div>
        <div id="backupBox" style="margin-top:14px">
          <span class="label" id="backupLabel"></span>
          <p class="note" id="backupHint" style="margin:4px 0 10px"></p>
          <div class="actions-row">
            <button class="btn btn-secondary btn-sm" type="button" id="backupDl"></button>
            <label class="btn btn-quiet btn-sm file-btn"><input type="file" id="backupFile" accept=".json,application/json"><span id="backupUpLabel"></span></label>
          </div>
        </div>
      </div>
    </div>
    <div class="report" id="report" aria-live="polite"></div>
  </section>

  <section id="results" aria-live="polite"></section>

  <details class="method panel no-print">
    <summary id="mTitle"></summary>
    <div id="mBody"></div>
  </details>
</main>

<footer id="footer" class="site"></footer>

<dialog id="shareDlg" class="dlg" aria-labelledby="shareTitle">
  <div class="dlg-head"><h2 id="shareTitle"></h2><button class="btn btn-quiet btn-sm" type="button" id="shareClose"></button></div>
  <div id="shareBody"></div>
</dialog>

<div id="deck" class="deck" hidden role="dialog" aria-modal="true" aria-label="Presentation">
  <div class="deck-stage" id="deckStage"></div>
  <div class="deck-bar">
    <button class="btn btn-quiet btn-sm" type="button" id="deckExit"></button>
    <span id="deckCount"></span>
    <div class="actions-row"><button class="btn btn-secondary btn-sm" type="button" id="deckPrev"></button><button class="btn btn-primary btn-sm" type="button" id="deckNext"></button></div>
  </div>
</div>

<div class="rp-doc" id="printDoc" aria-hidden="true"></div>

<script src="assets/core.js"></script>
<script src="assets/page.js"></script>
<script src="assets/qr.js"></script>
<script src="assets/dashboard.js"></script>
</body>
</html>
